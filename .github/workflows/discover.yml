name: discover
on: workflow_dispatch
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - run: |
          set +e
          curl -sIL -A "Mozilla/5.0" https://lkl.lt/rungtynes/11621 | head -30
          echo "== BODY =="
          curl -sL -A "Mozilla/5.0" https://lkl.lt/rungtynes/11621 | head -c 2500
          echo "== EN =="
          curl -sL -A "Mozilla/5.0" -o /dev/null -w "%{http_code} %{size_download}\n" https://en.lkl.lt/rungtynes/11621
