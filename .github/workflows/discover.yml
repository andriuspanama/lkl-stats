name: discover
on: workflow_dispatch
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -sL -A "Mozilla/5.0" https://lkl.lt/rungtynes/11621 -o page.html
          echo "== SCRIPTS =="
          grep -oE 'src="[^"]+\.js[^"]*"' page.html
          echo "== ENDPOINT HINTS =="
          grep -oiE '(https?:)?/[a-z0-9_/.-]*(api|ajax|json|stat|protocol|shot|play|boxscore)[a-z0-9_/.?=&-]*' page.html | sort -u
          for p in protokolas eiga metimai statistika lyderiai; do
            echo "== /rungtynes/11621/$p =="
            curl -sL -A "Mozilla/5.0" -o /dev/null -w "%{http_code} %{size_download}\n" https://lkl.lt/rungtynes/11621/$p
          done
